# ╔══════════════════════════════════════════════════════════════════╗
# ║  Hexo 站点配置示例 — wulitou-resume 主题                          ║
# ║                                                                  ║
# ║  用法：                                                          ║
# ║    cp themes/wulitou-resume/_example/_config.example.yml _config.yml  ║
# ║                                                                  ║
# ║  或者参照此文件修改你已有的 _config.yml，关键是以下几项：        ║
# ║    1. theme: wulitou-resume                                      ║
# ║    2. markdown.breaks: true  （代码块换行依赖）                  ║
# ║    3. highlight.enable: true （代码块高亮依赖）                 ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── 站点信息 ──────────────────────────────────────────────────────
language: zh-CN
url: https://yigefyw.github.io/resume-blog
root: /resume-blog/
permalink: posts/:title/

# ── 主题 ──────────────────────────────────────────────────────────
theme: wulitou-resume

# ── 目录 ──────────────────────────────────────────────────────────
source_dir: source
public_dir: public
skip_render: README.md

# ── Markdown 渲染 ────────────────────────────────────────────────
# breaks: true 是代码块正常换行的前提，wulitou-resume 的代码块组件依赖此设置
markdown:
  gfm: true
  pedantic: false
  sanitize: false
  tables: true
  breaks: true
  smartLists: true
  smartypants: true

# ── 代码高亮 ────────────────────────────────────────────────────────
# 主题代码块组件依赖 Hexo 内置 highlight.js 服务端高亮
# line_number: false — 主题自带行号样式，关掉 Hexo 默认行号避免冲突
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: '    '

# ── 生成器控制 ────────────────────────────────────────────────────
# 简历主题不需要博客功能，关闭归档/分类/标签生成器
index_generator:
  path: ''
  per_page: 10
  order_by: -date

archive: 0
category: 0
tag: 0

exclude_generator:
  - archive
  - category
  - tag

# ── 日期格式 ────────────────────────────────────────────────────────
date_format: 'YYYY-MM-DD'
time_format: HH:mm:ss

# ── 分页 ────────────────────────────────────────────────────────────
per_page: 10
pagination_dir: page

# ── 服务器 ────────────────────────────────────────────────────────────
port: 4000
logger: false

# ── Live2D 看板娘（可选）─────────────────────────────────────────────
# 需要先安装插件和模型：
#   npm install hexo-helper-live2d live2d-widget-model-koharu
# 不需要看板娘就整段删掉或设 enable: false
live2d:
  enable: true
  scriptFrom: local
  pluginRootPath: live2d_models/
  pluginJsPath: lib/
  pluginModelPath: assets/
  tagMode: false
  debug: false
  model:
    use: live2d-widget-model-koharu
  display:
    position: left
    width: 150
    height: 300
    scale: 1
    hOffset: 0
    vOffset: -20
  mobile:
    show: true
    scale: 0.5



