name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取 Hexo 主项目（主题源码已内置在仓库中）
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      # 2. Node 环境
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 3. 安装 Hexo 主项目依赖
      # 现在先用 npm install，不要求 package-lock.json
      - name: Install Hexo dependencies
        run: npm install --no-audit --no-fund

      # 4. 安装主题依赖，例如 sass
      - name: Install theme dependencies
        working-directory: themes/wulitou-resume
        run: npm install --no-audit --no-fund

      # 5. 如果主题 package.json 里有 build，就自动执行
      # 没有 build 脚本也不会报错
      - name: Build theme
        working-directory: themes/wulitou-resume
        run: npm run build --if-present

      # 6. 构建 Hexo
      - name: Build Hexo
        run: |
          npx hexo clean
          npx hexo generate

      # 7. 配置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # 8. 上传 Hexo 生成的 public 目录
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
